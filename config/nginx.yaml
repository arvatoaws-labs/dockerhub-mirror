version: 1
creds:
# - registry: "{{env \"SRC_REGISTRY\"}}"
#   user: "{{env \"SRC_USER\"}}"
#   pass: "{{env \"SRC_PASS\"}}"
- registry: "{{env \"DST_REGISTRY\"}}"
  user: "{{env \"DST_USER\"}}"
  pass: "{{env \"DST_PASS\"}}"

defaults:
  ratelimit:
    min: 20
    retry: 1m
  parallel: 2
sync:
- source: "{{env \"SRC_REGISTRY\"}}/{{env \"SRC_REPO\"}}"
  target: "{{env \"DST_REGISTRY\"}}/{{env \"DST_REPO\"}}"
  type: repository
  tags:
    allow:
    - "latest"
    - "mainline.*"
    - "stable.*"
    - "1.\\d+"
    - "1.\\d+.\\d+"
    - "alpine"
    - "alpine.*"
    - "1.\\d+-alpine"
    - "1.\\d+.\\d+-alpine"
    deny:
    - ".*perl.*"
    - "1.1\\d.*"
