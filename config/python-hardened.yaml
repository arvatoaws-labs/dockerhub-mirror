defaults:
  ratelimit:
    min: 20
    retry: 1m
  parallel: 2
sync:
- source: "{{env \"SRC_REGISTRY\"}}/{{env \"SRC_REPO\"}}"
  target: "{{env \"DST_REGISTRY\"}}/{{env \"DST_REPO\"}}"
  type: repository
  tags:
    allow:
    - "3"
    - "3.\\d+"
    deny:
    - ".*windows.*"
    - ".*nanonserver.*"
    - ".*rc.*"
    # EOL versions are ELS-only on dhi.io and need a separate entitlement
    - "3\\.[0-9]$"