name: docker-hardened-images
on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  push:
    branches:
    - master
    - main
  schedule:
  # * is a special character in YAML so you have to quote this string
  - cron: '0 13 * * *'

jobs:
  mirror:
    runs-on: arvato
    steps:
    - name: Checkout
      uses: actions/checkout@v5
    - name: Get Current Branch Name
      id: get_branch
      run: git rev-parse --abbrev-ref HEAD
    - name: Login to Docker Hub Hardened
      uses: docker/login-action@v3
      with:
        registry: dhi.io
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    # cert-manager
    - name: Mirror cert-manager-controller
      uses: arvatoaws-labs/dockerhub-mirror@main
      with:
        config: config/dhi.yaml
        src-registry: dhi.io
        src-repo: cert-manager-controller
        dst-repo: arvatoaws-labs/cert-manager-controller-hardened
    - name: Mirror cert-manager-cainjector
      uses: arvatoaws-labs/dockerhub-mirror@main
      with:
        config: config/dhi.yaml
        src-registry: dhi.io
        src-repo: cert-manager-cainjector
        dst-repo: arvatoaws-labs/cert-manager-cainjector-hardened
    - name: Mirror cert-manager-acmesolver
      uses: arvatoaws-labs/dockerhub-mirror@main
      with:
        config: config/dhi.yaml
        src-registry: dhi.io
        src-repo: cert-manager-acmesolver
        dst-repo: arvatoaws-labs/cert-manager-acmesolver-hardened
    - name: Mirror cert-manager-webhook
      uses: arvatoaws-labs/dockerhub-mirror@main
      with:
        config: config/dhi.yaml
        src-registry: dhi.io
        src-repo: cert-manager-webhook
        dst-repo: arvatoaws-labs/cert-manager-webhook-hardened

    # external-dns
    - name: Mirror external-dns
      uses: arvatoaws-labs/dockerhub-mirror@main
      with:
        config: config/dhi.yaml
        src-registry: dhi.io
        src-repo: external-dns
        dst-repo: arvatoaws-labs/external-dns-hardened

    # metrics-server
    - name: Mirror metrics-server
      uses: arvatoaws-labs/dockerhub-mirror@main
      with:
        config: config/dhi.yaml
        src-registry: dhi.io
        src-repo: metrics-server
        dst-repo: arvatoaws-labs/metrics-server-hardened

    # traefik
    - name: Mirror traefik
      uses: arvatoaws-labs/dockerhub-mirror@main
      with:
        config: config/dhi.yaml
        src-registry: dhi.io
        src-repo: traefik
        dst-repo: arvatoaws-labs/traefik-hardened

    # keda
    - name: Mirror keda
      uses: arvatoaws-labs/dockerhub-mirror@main
      with:
        config: config/dhi.yaml
        src-registry: dhi.io
        src-repo: keda
        dst-repo: arvatoaws-labs/keda-hardened

    